# 第 8 章：Grafana LGTM 監控堆疊（精簡地端版）
#
# 本 compose 一鍵拉起三個服務：
#   - loki    ：日誌聚合資料庫（LGTM 的 L）
#   - alloy   ：日誌收集器（Grafana 次世代收集器，取代已 EOL 的 Promtail）
#   - grafana ：視覺化平台（LGTM 的 G），已預先接好 Loki 資料源
#
# 應用程式把 JSON 日誌寫到 ./logs/app.log，Alloy 掛載同一資料夾、
# 持續 tail 該檔並推送至 Loki；Grafana 再透過 LogQL 查詢與視覺化。
#
# 啟動： docker compose up -d
# 關閉： docker compose down

services:
  loki:
    image: grafana/loki:3.7.4
    container_name: lgtm-loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"                      # 對外開放 Loki 的 HTTP 埠
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: lgtm-alloy
    command:                             # 啟動 Alloy 並載入設定
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "12345:12345"        # Alloy 內建 Web UI（可視化收集管線）
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/app:ro           # 把應用寫日誌的資料夾掛進容器
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.4.6
    container_name: lgtm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - loki

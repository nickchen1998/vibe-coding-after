# 第 5 章 5.3 示範：用 docker compose 一鍵拉起「一個 Master ＋ N 個 Worker」的蟲群。
#
# 直接採用 Locust 官方映像，把腳本以 volume 掛進容器（免自建映像）。
# 靶場（target_app）仍在你的主機上跑（port 8000）；容器內的 Worker 透過
# host.docker.internal 這個特殊主機名回連到主機的靶場。
#
# 用法：
#   docker compose up --scale worker=4      # 一鍵四工作者
#   瀏覽器開 http://localhost:8089 操作 Master 的 Web UI
#
# 僅供學習示範，勿用於生產。
services:
  master:
    image: locustio/locust:2.45.0
    volumes:
      - ./locustfile_cache.py:/mnt/locust/locustfile_cache.py
    command: -f /mnt/locust/locustfile_cache.py --master --host http://host.docker.internal:8000
    ports:
      - "8089:8089"      # 對外開放 Web UI

  worker:
    image: locustio/locust:2.45.0
    volumes:
      - ./locustfile_cache.py:/mnt/locust/locustfile_cache.py
    command: -f /mnt/locust/locustfile_cache.py --worker --master-host master
    depends_on:
      - master
